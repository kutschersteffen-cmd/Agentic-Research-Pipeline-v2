# Two things live in this file:
#
# 1. The app itself (`backend`, `frontend`) -- Corporate Readiness Plan,
#    Phase 1 (see docs/CORPORATE_READINESS_PLAN.md). An additive local-dev
#    path: `docker compose up backend frontend --build` gets a new machine
#    to a working stack without the multi-step README setup. The venv/npm
#    workflow in README "Setup" is unaffected and keeps working the same
#    way. Backend secrets/config still come from backend/.env (see
#    backend/.env.example) -- copy and fill it in before starting, same as
#    the non-Docker setup.
#
# 2. Local development infrastructure: Postgres/pgvector (required -- the
#    system of record, see backend/arp/db/), plus the opt-in object-storage
#    backend (object_store_client.py). Point the `backend` service's .env at
#    them (ARP_POSTGRES_DSN=postgresql+psycopg://arp:arp@postgres:5432/arp,
#    etc.), or at localhost equivalents for a venv-based `uvicorn --reload` run.
#
# Usage:
#   docker compose up --build                        # everything
#   docker compose up backend frontend --build        # just the app (starts `sandbox` too: Agent explorations)
#   docker compose up -d postgres                      # required; then: arp db init-postgres
#   docker compose up -d minio                         # optional; then: arp db init-object-store
#   docker compose up -d neo4j                         # optional: company graph for theme exposure layers
#   docker compose --profile compute up -d compute     # optional: compute service (rerank, embeddings, ...)
#
# Published images (docs/DEPLOY_WITH_DOCKER.md): `backend`, `frontend` and
# `compute` name their ghcr.io image next to `build:`. `docker compose pull
# backend frontend` fetches them (tag: ARP_IMAGE_TAG, default latest; compute:
# ARP_COMPUTE_IMAGE_TAG, default ARP_IMAGE_TAG), and `up` then runs them
# without building; `up --build` still builds from this checkout.

services:
  backend:
    image: ghcr.io/kutschersteffen-cmd/arp-backend:${ARP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Bound to 127.0.0.1 only -- keep it that way. The app runs in dev sign-in
    # mode (README "Sign-in"): there is no token, and every request from
    # loopback or ARP_DEV_TRUSTED_NETWORKS is signed in as the dev approver.
    # The browser's requests reach this container from the Docker bridge
    # (172.16.0.0/12), not loopback, hence the trusted range below. That is
    # only safe because the published port is loopback-bound: a bare
    # "8000:8000" publishes on 0.0.0.0, Docker would forward LAN traffic in
    # through the bridge too, and every host on the network would become an
    # approver. (Other containers on the compose network are trusted as well.)
    # Switching to real sign-in: create config/users.json, set
    # ARP_AUTH_MODE=local below and drop ARP_DEV_TRUSTED_NETWORKS. Tokens are
    # shared secrets over plain HTTP, so put TLS in front before widening ports.
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    env_file:  # optional, so `docker compose config` works on a fresh checkout
      - path: backend/.env
        required: false
    environment:  # overrides backend/.env
      ARP_AUTH_MODE: dev
      ARP_DEV_TRUSTED_NETWORKS: '["172.16.0.0/12"]'
      ARP_USERS_FILE: /app/config/users.json
      ARP_POSTGRES_DSN: postgresql+psycopg://arp:arp@postgres:5432/arp  # required; run `arp db init-postgres` once
      ARP_NEO4J_URI: bolt://neo4j:7687  # optional (`docker compose up -d neo4j`); no depends_on on purpose
      ARP_NEO4J_PASSWORD: arp_neo4j_test
      ARP_SANDBOX_URL: http://sandbox:8790
      # The page calls the API on its own origin (localhost:5173/api/...), and
      # the frontend's nginx forwards it here as Host: localhost, which the
      # default ARP_TRUSTED_HOSTS allows; set ARP_TRUSTED_HOSTS (JSON list) if
      # you call port 8000 under another host name. On Docker hosts whose compose
      # subnets come from 192.168.0.0/16, change the trusted range above to match.
    volumes:
      - arp_runs:/app/runs
      - arp_schemas:/app/schemas
      - arp_taxonomies:/app/taxonomies
      - arp_portfolios:/app/portfolios
      - arp_documents:/app/data/documents
      - arp_blobs:/app/data/blobs
      - arp_engagements:/app/engagements
      - arp_ballots:/app/ballots
      - arp_cache:/app/backend/.cache
      - arp_discovery_state:/app/backend/.discovery_state
      - arp_document_store:/app/backend/.document_store
      # Sign-in users for local mode (README "Sign-in"): config/users.json,
      # created from config/users.example.json. Not needed in dev mode. The
      # whole directory is mounted so a missing users.json is not turned into
      # an empty directory by Docker. Edits take effect without a restart.
      - ./config:/app/config:ro

  frontend:
    image: ghcr.io/kutschersteffen-cmd/arp-frontend:${ARP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    # Loopback too, and for the same reason: every /api/ request through this
    # port reaches the backend from the Docker bridge, a trusted address, so
    # publishing it beyond 127.0.0.1 in dev sign-in mode makes every host on the
    # network an approver. nginx proxies /api/ only for the names in
    # ARP_PUBLIC_HOSTS (default "localhost 127.0.0.1"; anything else gets 421).
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  # Runs the Agent's exploration code (sandbox/server.mjs, one workerd isolate per run, no network in the
  # isolate). No published port: only the backend calls it, over the compose network. Its tool calls go
  # back to the backend with a per-run token.
  sandbox:
    build: ./sandbox
    environment:
      ARP_API_URL: http://backend:8000

  # Optional (profile `compute`, so a plain `docker compose up` leaves it out):
  # the compute service, arp/compute/server.py (rerank, embeddings, spans,
  # tags, classify), called directly over HTTP. The backend cannot use a
  # self-hosted compute container yet (its client also expects Google
  # credentials), so it keeps computing in-process. It has no sign-in of its
  # own: keep it on the compose network and its port loopback-bound. The default
  # image runs on any CPU; on an NVIDIA host set ARP_COMPUTE_IMAGE_TAG=<tag>-cuda
  # and uncomment the GPU block below (needs the NVIDIA Container Toolkit).
  compute:
    image: ghcr.io/kutschersteffen-cmd/arp-compute:${ARP_COMPUTE_IMAGE_TAG:-${ARP_IMAGE_TAG:-latest}}
    profiles: [compute]
    build:
      context: .
      dockerfile: backend/Dockerfile.compute
      args:
        VARIANT: cpu
    environment:
      ARP_COMPUTE_DEVICE: auto  # cpu | cuda (GPU required: 503 without one) | auto
    ports:
      - "127.0.0.1:8080:8080"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  postgres:
    image: pgvector/pgvector:pg16
    # Loopback-only, like the app containers above. These dev services ship
    # with fixed throwaway credentials (arp/arp here, arp/arp12345 for minio)
    # and OpenSearch runs with its security plugin off, so publishing them on
    # 0.0.0.0 hands anyone on the network an open database, search cluster and
    # object store. Reach them from the host as 127.0.0.1 exactly as before;
    # container-to-container traffic goes over the compose network and is
    # unaffected by this.
    environment:
      POSTGRES_USER: arp
      POSTGRES_PASSWORD: arp
      POSTGRES_DB: arp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arp"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    # Optional: the company graph behind the theme exposure layers (arp/company_graph.py).
    # Without it every other screen works; the Layers table says the graph is not configured.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/arp_neo4j_test
    ports:
      - "127.0.0.1:7687:7687"
    volumes:
      - arp_neo4j_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arp
      MINIO_ROOT_PASSWORD: arp12345
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console
    volumes:
      - arp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  arp_runs:
  arp_schemas:
  arp_taxonomies:
  arp_portfolios:
  arp_documents:
  arp_blobs:
  arp_engagements:
  arp_ballots:
  arp_cache:
  arp_discovery_state:
  arp_document_store:
  arp_postgres_data:
  arp_neo4j_data:
  arp_minio_data:
