name: PR guards

# Separate from CI so adding or removing a label re-runs only this check, not the test suites.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Serialize push and label runs per PR (cancel-in-progress: false) so a concurrent label event cannot race
# override removal or overwrite a failing synchronize/reopened run with a stale label snapshot.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test-guard:
    name: No tests removed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # to drop override labels on a new push or reopen
    steps:
      # Override labels approve the commits the owner saw, not later ones: a new push or reopen drops them immediately,
      # before any checkout, so no later step or concurrent event sees stale override labels.
      - name: Drop overrides on new push or reopen
        if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && (contains(github.event.pull_request.labels.*.name, 'tests-weakened-ok') || contains(github.event.pull_request.labels.*.name, 'dead-code-cleanup')) }}
        run: |
          args=()
          if [ "$HAS_TESTS_WEAKENED_OK" = "true" ]; then
            args+=(--remove-label tests-weakened-ok)
          fi
          if [ "$HAS_DEAD_CODE_CLEANUP" = "true" ]; then
            args+=(--remove-label dead-code-cleanup)
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            gh pr edit "$PR_NUMBER" "${args[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_TESTS_WEAKENED_OK: ${{ contains(github.event.pull_request.labels.*.name, 'tests-weakened-ok') }}
          HAS_DEAD_CODE_CLEANUP: ${{ contains(github.event.pull_request.labels.*.name, 'dead-code-cleanup') }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the guard
        run: python3 .github/scripts/test_guard.py --selftest

      - name: Compare test counts with main
        run: |
          if [ "$EVENT_ACTION" = "labeled" ] || [ "$EVENT_ACTION" = "unlabeled" ]; then
            if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -Fxiq -e 'tests-weakened-ok' -e 'dead-code-cleanup'; then
              echo "Override label active on live PR; skipping test count comparison."
              exit 0
            fi
          fi
          python3 .github/scripts/test_guard.py "origin/$BASE_REF"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}

  arch-guard:
    name: Architecture & import cycles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Self-test the guard
        run: python3 .github/scripts/arch_guard.py --selftest

      - name: Enforce strict layer DAG and zero import cycles
        run: python3 .github/scripts/arch_guard.py --strict

  context-guard:
    name: Generated context guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Self-test the guard
        run: python3 .github/scripts/context_guard.py --selftest

      - name: Reject generated wiki files outside context-refresh/*
        run: python3 .github/scripts/context_guard.py --head-ref "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}  # via env: branch names are attacker-controlled

  context-selftests:
    name: Context stack self-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install graphify
        run: pip install graphifyy==0.9.92

      - name: Self-test build_graph.sh
        run: bash scripts/build_graph_selftest.sh

      - name: Self-test the session hook
        run: bash .claude/hooks/context_stack_selftest.sh

      # Node 22 rejects a bare directory after --test, so name the files.
      - name: Test Atlas page logic
        run: node --test scripts/atlas/*.test.mjs

      - name: Self-test the Atlas data builder
        run: python3 scripts/atlas/build_data.py --selftest

  holdout-scripts:
    name: Holdout scripts self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Self-test the docs-only "not behind main" check
        run: bash .github/scripts/main_ahead_docs_only.sh --selftest

      - name: Self-test the Holdout completeness check
        run: python3 .github/scripts/holdout_complete.py --selftest

      - name: Self-test the Rows line parser
        run: python3 .github/scripts/holdout_rows.py --selftest
